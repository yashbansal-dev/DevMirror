name: DevMirror CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build all workspace packages
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Test CLI analyze command
        run: npx tsx apps/cli/src/index.ts analyze ./examples/demo-fullstack

      - name: Test CLI snapshot generation
        run: npx tsx apps/cli/src/index.ts snapshot
